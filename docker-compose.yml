services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xiguifei_kitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - kitchen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xiguifei_kitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/xiguifei_kitchen
      LISTEN_ADDR: 0.0.0.0:8787
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kitchen-postgres:
