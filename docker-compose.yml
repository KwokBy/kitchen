services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-p", "5433", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: xiguifei_kitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - kitchen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U postgres -d xiguifei_kitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/xiguifei_kitchen
      LISTEN_ADDR: 172.25.0.1:8787
      WECHAT_SUBSCRIBE_TEMPLATE_ID: TRB0XLJlO3Dw0DQHs0B_jMEXYU9crlV6Wb8jpBpNA0A
      WECHAT_MINIPROGRAM_STATE: trial
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: ["tcp-listen:8787,fork,reuseaddr", "tcp-connect:172.25.0.1:8787"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=compose_default"
      - "traefik.http.middlewares.kitchen-api-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.kitchen-api-https.redirectscheme.permanent=true"
      - "traefik.http.routers.kitchen-api-http.rule=Host(`glup.top`)"
      - "traefik.http.routers.kitchen-api-http.entrypoints=web"
      - "traefik.http.routers.kitchen-api-http.middlewares=kitchen-api-https"
      - "traefik.http.routers.kitchen-api-https.rule=Host(`glup.top`)"
      - "traefik.http.routers.kitchen-api-https.entrypoints=websecure"
      - "traefik.http.routers.kitchen-api-https.middlewares=kitchen-api-security"
      - "traefik.http.routers.kitchen-api-https.tls=true"
      - "traefik.http.routers.kitchen-api-https.tls.certresolver=myresolver"
      - "traefik.http.middlewares.kitchen-api-security.headers.stsseconds=31536000"
      - "traefik.http.middlewares.kitchen-api-security.headers.contenttypenosniff=true"
      - "traefik.http.services.kitchen-api.loadbalancer.server.port=8787"
    networks:
      - proxy
    depends_on:
      - api

volumes:
  kitchen-postgres:

networks:
  proxy:
    external: true
    name: compose_default
